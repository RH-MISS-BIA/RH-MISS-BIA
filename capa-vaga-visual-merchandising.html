<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capa Vaga Visual Merchandising - MISS BIA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
        }

        .container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        /* Fundo com gradiente premium */
        .background {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8f9fa 0%, #e8eef5 50%, #f0f4f9 100%);
            position: relative;
        }

        /* Padrão sutil de loja iluminada */
        .pattern-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(173, 216, 230, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(25, 68, 124, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Elementos decorativos - araras desfocadas */
        .deco-element {
            position: absolute;
            opacity: 0.08;
            pointer-events: none;
        }

        .deco-left {
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 300px;
            height: 400px;
            background: linear-gradient(90deg, transparent, rgba(25, 68, 124, 0.5), transparent);
            filter: blur(20px);
        }

        .deco-right {
            right: -50px;
            top: 40%;
            width: 350px;
            height: 450px;
            background: linear-gradient(90deg, transparent, rgba(219, 112, 147, 0.4), transparent);
            filter: blur(25px);
        }

        /* Container principal de conteúdo */
        .content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 50px;
            position: relative;
            z-index: 10;
        }

        /* Logo no topo */
        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #194478;
            text-transform: uppercase;
            font-style: italic;
        }

        .logo-underline {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #194478, #DB7093, transparent);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        /* Seção central principal */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 20px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            background: rgba(25, 68, 124, 0.1);
            border: 2px solid #194478;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #194478;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .main-title {
            font-size: 72px;
            font-weight: 800;
            color: #194478;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .main-subtitle {
            font-size: 52px;
            font-weight: 600;
            color: #2E5C8A;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Linha decorativa */
        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #DB7093, transparent);
            margin: 25px auto;
            border-radius: 2px;
        }

        .secondary-text {
            font-size: 20px;
            font-weight: 500;
            color: #555;
            line-height: 1.6;
            max-width: 600px;
            margin: 20px 0;
            letter-spacing: 0.5px;
        }

        /* Seal/Badge com benefícios */
        .benefits-seal {
            background: rgba(173, 216, 230, 0.2);
            border: 2px solid #ADD8E6;
            border-radius: 12px;
            padding: 15px 25px;
            margin: 20px 0;
            font-size: 13px;
            font-weight: 600;
            color: #194478;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.8;
        }

        /* Rodapé com informações de contato */
        .footer {
            width: 100%;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(25, 68, 124, 0.2);
        }

        .footer-text {
            font-size: 16px;
            font-weight: 600;
            color: #194478;
            margin-bottom: 8px;
        }

        .footer-contact {
            font-size: 24px;
            font-weight: 700;
            color: #DB7093;
            letter-spacing: 1px;
        }

        /* Elementos decorativos flutuantes */
        .accent-circle-1 {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(25, 68, 124, 0.1), transparent);
            top: 5%;
            right: 5%;
            pointer-events: none;
        }

        .accent-circle-2 {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(219, 112, 147, 0.08), transparent);
            bottom: 10%;
            left: 5%;
            pointer-events: none;
        }

        /* Responsividade para preview */
        @media (max-width: 1080px) {
            .container {
                width: 100vw;
                height: 100vw;
                max-width: 1080px;
                max-height: 1080px;
            }

            .content-wrapper {
                padding: 40px 30px;
            }

            .main-title {
                font-size: 54px;
            }

            .main-subtitle {
                font-size: 38px;
            }

            .secondary-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background">
            <div class="pattern-overlay"></div>
            
            <!-- Elementos decorativos desfocados -->
            <div class="deco-element deco-left"></div>
            <div class="deco-element deco-right"></div>
            
            <!-- Círculos acentuados -->
            <div class="accent-circle-1"></div>
            <div class="accent-circle-2"></div>
            
            <!-- Conteúdo principal -->
            <div class="content-wrapper">
                <!-- Header com logo -->
                <div class="header">
                    <div class="logo">MISS BIA</div>
                    <div class="logo-underline"></div>
                </div>
                
                <!-- Conteúdo central -->
                <div class="main-content">
                    <div class="badge">🎯 Vaga Aberta</div>
                    
                    <div>
                        <h1 class="main-title">Visual</h1>
                        <h2 class="main-subtitle">Merchandising</h2>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <p class="secondary-text">Faça parte do time MISS BIA</p>
                    <p class="secondary-text">Atuação presencial nas nossas 21 lojas</p>
                    
                    <div class="benefits-seal">
                        ✓ CLT + Benefícios + Plano de Crescimento
                    </div>
                </div>
                
                <!-- Rodapé com contato -->
                <div class="footer">
                    <div class="footer-text">Envie seu currículo para:</div>
                    <div class="footer-contact">11 95117-0077</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
