<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Vaga de Auxiliar de Estoque — Miss Bia</title>
  <desc id="desc">Arte quadrada sofisticada para divulgação de vaga presencial CLT em Itapevi.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#270018"/>
      <stop offset=".48" stop-color="#710043"/>
      <stop offset="1" stop-color="#a50069"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7a6"/>
      <stop offset=".38" stop-color="#ffd928"/>
      <stop offset="1" stop-color="#f3a400"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1d0012" flood-opacity=".36"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".2"/>
    </pattern>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Premium background -->
  <rect width="1200" height="1200" fill="url(#background)"/>
  <circle cx="1070" cy="75" r="290" fill="#ff40b5" opacity=".18" filter="url(#softGlow)"/>
  <circle cx="65" cy="1110" r="340" fill="#ffca16" opacity=".12" filter="url(#softGlow)"/>
  <path d="M720 -30 C920 145 960 245 1225 250 L1225 -30Z" fill="#f6c800" opacity=".08"/>
  <path d="M0 865 C175 752 360 837 503 954 C687 1104 901 952 1200 768 L1200 1200 L0 1200Z" fill="#240015" opacity=".42"/>
  <rect x="740" y="186" width="390" height="390" rx="56" fill="url(#dots)" opacity=".38" transform="rotate(12 935 381)"/>

  <!-- Brand name -->
  <text x="70" y="118" class="serif" font-size="52" font-weight="700" letter-spacing="4" fill="#F8DB00">MISS BIA</text>

  <!-- Header badge -->
  <g filter="url(#shadow)">
    <rect x="783" y="65" width="347" height="74" rx="37" fill="url(#gold)"/>
    <circle cx="826" cy="102" r="18" fill="#730047"/>
    <path d="M817 103l6 6 13-16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="969" y="110" text-anchor="middle" class="sans" font-size="22" font-weight="900" letter-spacing="1.5" fill="#66003f">VAGA ABERTA</text>
  </g>

  <!-- Job title -->
  <text x="72" y="241" class="sans" font-size="24" font-weight="800" letter-spacing="6" fill="#ffe35a">OPORTUNIDADE</text>
  <rect x="72" y="264" width="92" height="6" rx="3" fill="url(#gold)"/>
  <text x="70" y="372" class="sans" font-size="106" font-weight="900" letter-spacing="-3" fill="#fff">AUXILIAR</text>
  <text x="70" y="474" class="sans" font-size="106" font-weight="900" letter-spacing="-3" fill="#fff">DE ESTOQUE</text>
  <text x="75" y="521" class="sans" font-size="25" font-weight="600" fill="#fce8f5">Venha crescer com a Miss Bia Lingerie.</text>

  <!-- Decorative inventory illustration -->
  <g transform="translate(792 238)" filter="url(#shadow)">
    <rect x="28" y="64" width="246" height="214" rx="28" fill="#fff" fill-opacity=".12" stroke="#fff" stroke-opacity=".24" stroke-width="2"/>
    <path d="M61 110h181M61 170h181M61 230h181" stroke="#ffe052" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <path d="M85 89v164M157 89v164M220 89v164" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".82"/>
    <g fill="url(#gold)">
      <rect x="68" y="119" width="48" height="34" rx="6"/><rect x="167" y="119" width="42" height="34" rx="6"/>
      <rect x="101" y="179" width="43" height="34" rx="6"/><rect x="178" y="179" width="47" height="34" rx="6"/>
    </g>
    <g fill="#fff" fill-opacity=".92">
      <rect x="75" y="126" width="22" height="5" rx="2"/><rect x="174" y="126" width="20" height="5" rx="2"/>
      <rect x="108" y="186" width="20" height="5" rx="2"/><rect x="185" y="186" width="20" height="5" rx="2"/>
    </g>
    <path d="M-2 305h314" stroke="#ffe052" stroke-width="8" stroke-linecap="round"/>
    <circle cx="37" cy="325" r="14" fill="#ffe052"/><circle cx="260" cy="325" r="14" fill="#ffe052"/>
  </g>

  <!-- Information cards -->
  <g filter="url(#shadow)">
    <rect x="70" y="575" width="512" height="145" rx="28" fill="url(#card)" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="127" cy="647" r="32" fill="url(#gold)"/>
    <path d="M127 625c-13 0-23 10-23 23 0 17 23 33 23 33s23-16 23-33c0-13-10-23-23-23zm0 31a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="#6d0043"/>
    <text x="181" y="626" class="sans" font-size="19" font-weight="800" letter-spacing="2" fill="#ffe35a">LOCAL DE TRABALHO</text>
    <text x="181" y="671" class="sans" font-size="30" font-weight="800" fill="#fff">ITAPEVI</text>
    <text x="181" y="699" class="sans" font-size="20" font-weight="600" fill="#f9ddeb">100% PRESENCIAL</text>

    <rect x="618" y="575" width="512" height="145" rx="28" fill="url(#card)" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="675" cy="647" r="32" fill="url(#gold)"/>
    <path d="M653 637h44v31h-44zm7-8h30v10h-30z" fill="#6d0043"/>
    <text x="729" y="626" class="sans" font-size="19" font-weight="800" letter-spacing="2" fill="#ffe35a">CONTRATAÇÃO</text>
    <text x="729" y="671" class="sans" font-size="30" font-weight="800" fill="#fff">CLT • R$ 2.031,00</text>
    <text x="729" y="699" class="sans" font-size="20" font-weight="600" fill="#f9ddeb">INÍCIO IMEDIATO</text>
  </g>

  <!-- Schedule and benefits -->
  <g>
    <rect x="70" y="760" width="512" height="160" rx="26" fill="#250017" fill-opacity=".38" stroke="#ffe052" stroke-opacity=".35"/>
    <text x="105" y="807" class="sans" font-size="20" font-weight="900" letter-spacing="3" fill="#ffe35a">HORÁRIO</text>
    <text x="105" y="851" class="sans" font-size="22" font-weight="700" fill="#fff">SEG. A SEX.: 8H30 ÀS 17H00</text>
    <text x="105" y="887" class="sans" font-size="22" font-weight="700" fill="#fff">SÁBADO: 8H30 ÀS 16H00</text>

    <rect x="618" y="760" width="512" height="160" rx="26" fill="#250017" fill-opacity=".38" stroke="#ffe052" stroke-opacity=".35"/>
    <text x="653" y="807" class="sans" font-size="20" font-weight="900" letter-spacing="3" fill="#ffe35a">BENEFÍCIOS</text>
    <text x="653" y="851" class="sans" font-size="20" font-weight="700" fill="#fff">Plano odontológico • Vale-transporte</text>
    <text x="653" y="887" class="sans" font-size="20" font-weight="700" fill="#fff">Convênio SESC • 10% off produtos</text>
  </g>

  <!-- Call to action -->
  <g filter="url(#shadow)">
    <rect x="70" y="970" width="1060" height="151" rx="32" fill="url(#gold)"/>
    <circle cx="150" cy="1046" r="43" fill="#20bf61"/>
    <path d="M130 1080l5-18a33 33 0 1 1 14 13zm17-52c-3 0-5 2-5 5 1 12 11 24 23 28 3 1 6-1 8-4l2-4-8-4-3 4c-5-2-9-6-11-11l4-3-4-8c-2-2-4-3-6-3z" fill="#fff"/>
    <text x="221" y="1023" class="sans" font-size="18" font-weight="900" letter-spacing="2.4" fill="#610039">ENVIE SEU CURRÍCULO PELO WHATSAPP</text>
    <text x="221" y="1083" class="sans" font-size="52" font-weight="900" fill="#610039">(11) 95117-0077</text>
    <text x="995" y="1062" text-anchor="end" class="sans" font-size="18" font-weight="800" fill="#610039">FAÇA PARTE DO NOSSO TIME</text>
  </g>

  <text x="600" y="1166" text-anchor="middle" class="sans" font-size="15" font-weight="700" letter-spacing="2.2" fill="#fff" opacity=".8">MISS BIA LINGERIE • ITAPEVI</text>
</svg>
